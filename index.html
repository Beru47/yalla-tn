<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<meta property="og:type" content="website">

<meta property="og:description" content="A personal invitation to the first lights of Yalla. Tunisia gets better when each of us changes a little.">

<meta property="og:url" content="https://beru47.github.io/yalla-tn/">

<link rel="apple-touch-icon" href="yalla.png">

<style>
  :root {
    --bg:#06030F; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
    --ink:#F4F1FF; --muted:#A79FC4; --violet:#6D4AE0; --violet-l:#A98CFF; --gold:#FFC148; --gold-2:#FFE7A8; --teal:#3FD2C0;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; }
  body {
    min-height:100vh; background:var(--bg); color:var(--ink);
    font:16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    background-image:radial-gradient(900px 600px at 18% 20%, rgba(109,74,224,.26), transparent 60%), radial-gradient(700px 500px at 85% 85%, rgba(255,193,72,.09), transparent 60%);
    background-attachment:fixed; display:flex; flex-direction:column;
  }
  html[lang="ar"] body { font-family:Cairo, system-ui, sans-serif; }
  body.locked { overflow:hidden; }
  button { font:inherit; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:3px; }

  /* ---------- language menu: globe + names in their own language ---------- */
  .lang { position:relative; }
  .lang-btn { display:flex; align-items:center; gap:8px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 14px; cursor:pointer; font-size:14px; font-weight:600; transition:background .3s var(--ease); }
  .lang-btn:hover { background:rgba(255,255,255,.08); }
  .lang-btn svg { width:17px; height:17px; flex:none; }
  .lang-btn .chev { width:14px; height:14px; opacity:.6; transition:transform .3s var(--ease); }
  .lang-btn[aria-expanded="true"] .chev { transform:rotate(180deg); }
  .lang-menu { position:absolute; top:calc(100% + 8px); inset-inline-end:0; min-width:170px; margin:0; padding:6px; list-style:none; z-index:60;
    background:rgba(20,14,40,.92); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--line); border-radius:14px; box-shadow:0 20px 50px rgba(0,0,0,.5);
    opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity .25s var(--ease), transform .25s var(--ease); }
  .lang-menu.open { opacity:1; transform:none; pointer-events:auto; }
  .lang-menu button { width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:start; color:var(--ink); background:none; border:0; border-radius:9px; padding:10px 12px; cursor:pointer; font-size:15px; }
  .lang-menu button:hover { background:rgba(255,255,255,.07); }
  .lang-menu button[aria-checked="true"]::after { content:""; width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px var(--gold); }
  .lang-menu [lang="ar"] { font-family:Cairo, sans-serif; }

  /* ---------- the invitation ---------- */
  #gate { position:fixed; inset:0; z-index:50; overflow:hidden; display:flex; flex-direction:column;
    background:radial-gradient(600px 420px at 50% 36%, rgba(109,74,224,.30), transparent 70%), linear-gradient(#06030F, #0b0620 70%, #120a2a);
    transition:opacity 1s var(--ease), visibility 1s; }
  #gate.gone { opacity:0; visibility:hidden; }
  #gate .top { display:flex; justify-content:flex-end; padding:18px 20px; position:relative; z-index:3; }
  .invite { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 22px 160px; position:relative; z-index:2; }
  .invite .who { font-size:clamp(28px, 7vw, 40px); font-weight:900; color:var(--gold-2); text-shadow:0 0 22px rgba(255,193,72,.55); margin:0; min-height:1em; }
  .invite h1 { font-size:clamp(30px, 8vw, 48px); line-height:1.1; margin:2px 0 12px; font-weight:900; }
  .invite .num { display:inline-block; font-size:12px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:var(--gold); border:1px solid rgba(255,193,72,.35); border-radius:999px; padding:5px 13px; margin-bottom:14px; }
  html[lang="ar"] .invite .num { letter-spacing:0; text-transform:none; font-size:13px; }
  .invite p { color:var(--muted); max-width:400px; margin:0 0 30px; }

  .hold { position:relative; width:132px; height:132px; border:0; border-radius:50%; background:none; padding:0; cursor:pointer; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .hold .ring { position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(var(--gold) calc(var(--p, 0) * 1turn), rgba(255,255,255,.08) 0); -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); }
  .hold img { position:absolute; inset:14px; width:104px; height:104px; border-radius:50%; object-fit:cover; filter:saturate(.6) brightness(.7); transition:filter .4s, transform .4s var(--ease), box-shadow .4s;
    box-shadow:0 0 calc(20px + var(--p, 0) * 80px) rgba(255,193,72, calc(.15 + var(--p, 0) * .6)); transform:scale(calc(1 + var(--p, 0) * .06)); filter:saturate(calc(.6 + var(--p, 0) * .6)) brightness(calc(.7 + var(--p, 0) * .5)); }
  .hold:not(.active) .ring { animation:pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(255,193,72,.0); } 50% { box-shadow:0 0 0 10px rgba(255,193,72,.08); } }
  #gate, #gate * { -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  .hold img { pointer-events:none; -webkit-user-drag:none; }
  .hold:focus { outline:none; } .hold:focus-visible { outline:2px solid var(--gold); outline-offset:6px; }
  /* on a computer: scan the invitation onto the phone */
  .gate-qr { display:none; margin-top:22px; align-items:center; gap:14px; text-align:start; max-width:360px; }
  .gate-qr div { flex:none; width:120px; height:120px; background:#fff; border-radius:14px; padding:9px; }
  .gate-qr div svg { width:100%; height:100%; display:block; }
  .gate-qr p { margin:0; font-size:14px; color:var(--muted); }
  @media (hover:hover) and (pointer:fine) { .gate-qr.on { display:flex; } }
  .hint { margin-top:16px; font-size:14px; color:var(--muted); letter-spacing:.3px; }
  .hold[disabled] { cursor:default; opacity:.45; }

  /* the medina at night: its windows light up when your lamp does */
  .city { position:absolute; left:0; right:0; bottom:0; height:190px; z-index:1; }
  .city svg { width:100%; height:100%; display:block; }
  .city .b { fill:#0d0822; }
  .city .w { fill:#1c1536; transition:fill .6s, filter .6s; transition-delay:var(--d, 0s); }
  #gate.lit .city .w { fill:var(--gold-2); filter:drop-shadow(0 0 4px rgba(255,193,72,.9)); }
  #gate.lit .hold img { filter:none; box-shadow:0 0 120px rgba(255,193,72,.9), 0 0 220px rgba(169,140,255,.55); transform:scale(1.12); }
  .welcome { position:absolute; left:0; right:0; top:44%; text-align:center; padding:0 22px; z-index:3; font-size:clamp(22px, 6vw, 30px); font-weight:900; color:var(--gold-2); text-shadow:0 0 24px rgba(255,193,72,.7);
    opacity:0; transform:translateY(12px); transition:opacity .9s .9s var(--ease), transform .9s .9s var(--ease); pointer-events:none; }
  #gate.lit .invite { opacity:0; transition:opacity .6s .3s; }
  #gate.lit .welcome { opacity:1; transform:none; }

  /* ---------- the page ---------- */
  header, main, footer { width:100%; max-width:1120px; margin:0 auto; padding:0 24px; position:relative; }
  header { display:flex; align-items:center; justify-content:space-between; padding-top:20px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; }
  .brand img { width:30px; height:30px; border-radius:8px; }
  main { flex:1; display:grid; grid-template-columns:1.1fr .9fr; grid-template-areas:'hero card' 'why card'; column-gap:56px; row-gap:32px; align-items:start; padding-top:40px; padding-bottom:40px; }
  .hero { grid-area:hero; } .why { grid-area:why; } .card { grid-area:card; align-self:center; }
  .hero .logo { width:120px; height:120px; border-radius:30px; display:block; margin-bottom:24px; box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 20px 70px rgba(109,74,224,.55), 0 0 120px rgba(255,193,72,.12); }
  .pill { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--gold); border:1px solid rgba(255,193,72,.35); border-radius:999px; padding:4px 12px; margin-bottom:16px; }
  html[lang="ar"] .pill { text-transform:none; letter-spacing:0; }
  h1.main { font-size:clamp(36px, 5vw, 60px); line-height:1.08; margin:0 0 16px; font-weight:900; letter-spacing:-.5px; }
  h1.main em { font-style:normal; background:linear-gradient(90deg, var(--violet-l), var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .lead { color:var(--muted); font-size:18px; max-width:520px; margin:0; }
  .why h2 { font-size:13px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--gold); margin:0 0 10px; }
  html[lang="ar"] .why h2 { text-transform:none; letter-spacing:0; font-size:15px; }
  .mission { margin:0 0 22px; font-size:16.5px; max-width:520px; opacity:.92; }
  .lit, .litv { font-style:normal; font-weight:700; color:var(--gold-2); text-shadow:0 0 14px rgba(255,193,72,.55), 0 0 32px rgba(255,193,72,.25); }
  .litv { color:#D9CCFF; text-shadow:0 0 14px rgba(169,140,255,.65), 0 0 32px rgba(109,74,224,.35); }
  .pillars { list-style:none; padding:0; margin:0; display:grid; gap:14px; max-width:520px; }
  .pillars li { display:flex; gap:14px; align-items:flex-start; }
  .pillars b { display:block; color:var(--gold-2); text-shadow:0 0 12px rgba(255,193,72,.45); }
  .pillars span { color:var(--muted); font-size:15px; }
  .dot { flex:none; width:36px; height:36px; border-radius:11px; display:grid; place-items:center; background:var(--card); border:1px solid var(--line); }
  .dot svg { width:18px; height:18px; }
  .card { background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03)); border:1px solid var(--line); border-radius:24px; padding:28px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 30px 80px rgba(0,0,0,.45); }
  .card h2 { margin:0 0 4px; font-size:20px; }
  .card .sub { margin:0 0 20px; color:var(--muted); font-size:14px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; background:var(--violet); color:#fff; text-decoration:none; font-weight:800; font-size:17px; padding:16px 18px; border-radius:14px; transition:transform .3s var(--ease), box-shadow .3s var(--ease); box-shadow:0 10px 30px rgba(109,74,224,.45); }
  .btn:hover { transform:translateY(-2px); box-shadow:0 16px 40px rgba(109,74,224,.6); }
  .btn svg { width:20px; height:20px; }
  .meta { display:flex; justify-content:center; gap:14px; color:var(--muted); font-size:12.5px; margin:10px 0 22px; }
  .row { display:grid; grid-template-columns:auto 1fr; gap:20px; align-items:center; border-top:1px solid var(--line); padding-top:20px; }
  #qr { width:116px; height:116px; background:#fff; border-radius:12px; padding:8px; }
  #qr svg { width:100%; height:100%; display:block; }
  .row p { margin:0; font-size:14px; color:var(--muted); }
  .row p b { color:var(--ink); }
  ol { margin:20px 0 0; padding-inline-start:20px; color:var(--muted); font-size:14px; }
  ol li { margin:6px 0; }
  ol li::marker { color:var(--gold); font-weight:700; }

  .thanks { text-align:center; max-width:640px; margin:8px auto 28px; padding:0 24px; }
  .street { display:flex; align-items:flex-end; justify-content:center; gap:clamp(12px, 4vw, 34px); margin:8px auto 22px; }
  .lamp { display:flex; flex-direction:column; align-items:center; }
  .lamp i { width:10px; height:10px; border-radius:50%; background:#2b2440; transition:background .7s, box-shadow .7s; transition-delay:calc(var(--d) * .22s); }
  .lamp b { width:2px; height:46px; background:linear-gradient(#3b3355, transparent); }
  .lamp.you i { width:16px; height:16px; }
  .lamp.you b { height:64px; }
  .lamp.you span { font-size:11px; font-weight:800; color:var(--gold); margin-top:4px; opacity:0; transition:opacity .7s; transition-delay:calc(var(--d) * .22s); max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .street.on .lamp i { background:var(--gold-2); box-shadow:0 0 10px var(--gold), 0 0 28px rgba(255,193,72,.55); }
  .street.on .lamp.you i { box-shadow:0 0 14px var(--gold), 0 0 44px rgba(255,193,72,.8), 0 0 90px rgba(169,140,255,.4); }
  .street.on .lamp.you span { opacity:1; }
  .thanks .t1 { font-size:clamp(19px, 2.6vw, 24px); font-weight:800; line-height:1.4; margin:0 0 10px; }
  .thanks .t2 { color:var(--muted); font-size:16px; margin:0 0 20px; }
  .send { display:inline-flex; align-items:center; gap:8px; color:var(--gold-2); text-decoration:none; font-weight:800; border:1px solid rgba(255,193,72,.45); border-radius:999px; padding:11px 20px; transition:background .3s var(--ease), box-shadow .3s var(--ease); }
  .send:hover { background:rgba(255,193,72,.1); box-shadow:0 0 24px rgba(255,193,72,.3); }
  .send svg { width:18px; height:18px; }
  footer { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:13px; padding-bottom:24px; }
  .sticky { display:none; }

  @media (max-width: 860px) {
    main { grid-template-columns:1fr; grid-template-areas:'hero' 'card' 'why'; row-gap:28px; padding-top:20px; padding-bottom:110px; }
    .hero .logo { width:72px; height:72px; border-radius:19px; margin-bottom:16px; }
    h1.main { font-size:clamp(32px, 9vw, 40px); }
    .lead { font-size:16px; }
    .row { display:none; }
    .card { padding:22px; border-radius:20px; }
    .sticky { display:block; position:fixed; left:0; right:0; bottom:0; z-index:10; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
      background:linear-gradient(180deg, rgba(6,3,15,0), rgba(6,3,15,.92) 35%); transition:transform .35s var(--ease), opacity .35s var(--ease); }
    .sticky.hide { transform:translateY(110%); opacity:0; pointer-events:none; }
    .city { height:150px; }
    .invite { padding-bottom:130px; }
  }
  @media (max-width: 420px) { header, main, footer { padding-left:16px; padding-right:16px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition-duration:.01s !important; transition-delay:0s !important; } }
</style>
</head>
<body class="locked">

<template id="langTpl">
  <div class="lang">
    <button type="button" class="lang-btn" aria-haspopup="menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <span class="lang-cur"></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <ul class="lang-menu" role="menu">
      <li role="none"><button type="button" role="menuitemradio" data-lang="ar" lang="ar" dir="rtl">العربية</button></li>

      <li role="none"><button type="button" role="menuitemradio" data-lang="en" lang="en">English</button></li>
    </ul>
  </div>
</template>

<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gTitle">
  <div class="top" data-lang-slot></div>
  <div class="invite">
    <p class="who" id="who"></p>
    <h1 id="gTitle" data-t="gTitle"></h1>
    <span class="num" id="num" hidden></span>
    <p data-t="gSub" id="gSub"></p>
    <button type="button" class="hold" id="hold" aria-describedby="hint">
      <span class="ring"></span>
      <img src="yalla.png" alt="" draggable="false">
    </button>
    <div class="hint" id="hint" data-t="hint"></div>
    <div class="gate-qr" id="gateQr"><div id="gqr" role="img" aria-label="QR code"></div><p data-t="gateQr"></p></div>
  </div>

</div>

<header>
  <div class="brand"><img src="yalla.png" alt=""><span>Yalla</span></div>
  <div data-lang-slot></div>
</header>

  <section class="hero">

    <h1 class="main" data-t="h1"></h1>
    <p class="lead" data-t="lead"></p>

    <ul class="pillars">
      <li><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#A98CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5M14 19c0-2 1.5-3.5 4-3.5s3 1 3 3.5"/></svg></span><div><b data-t="p1"></b><span data-t="p1d"></span></div></li>
      <li><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#FFC148" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.4 5.6L20 9.3l-4.3 3.9 1.2 5.8L12 16l-4.9 3 1.2-5.8L4 9.3l5.6-.7z"/></svg></span><div><b data-t="p2"></b><span data-t="p2d"></span></div></li>
      <li><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#3FD2C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="8" height="14" rx="2"/><rect x="13" y="5" width="8" height="14" rx="2"/><path d="M6 15l2-3 2 3M16 13l1.5 2 2.5-4"/></svg></span><div><b data-t="p3"></b><span data-t="p3d"></span></div></li>
    </ul>
  </section>

  <section class="card" aria-labelledby="dl">
    <h2 id="dl" data-t="dlTitle"></h2>
    <p class="sub" data-t="dlSub"></p>
    <a class="btn" id="download" href="#" data-apk rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      <span data-t="btn"></span>
    </a>
    <div class="meta"><span>Android 8+</span><span>·</span><span data-t="ios"></span></div>
    <div class="row">
      <div id="qr" role="img" aria-label="QR code"></div>

      <li data-t="s3"></li>

  </section>
</main>

<section class="thanks" id="thanks">
  <div class="street" id="street" aria-hidden="true"></div>
  <p class="t1" data-t="thanks1"></p>
  <p class="t2" data-t="thanks2"></p>
  <a class="send" href="mailto:yalla.eagle@gmail.com?subject=Yalla%20beta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg><span data-t="send"></span></a>
</section>

<div class="sticky" id="sticky"><a class="btn" href="#" data-apk rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-t="btn"></span></a></div>

<footer>
  <span data-t="foot"></span>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous"></script>

  },
  ar: {
    name: 'العربية',
    gTitle: 'وقع عليك الاختيار.', gTitleAnon: 'وقع عليك الاختيار.',
    gSub: 'من أوائل من يرون يلّا، قبل بقية تونس.',
    num: 'الدعوة رقم {n}', hint: 'اضغط مطوّلًا على النور',
    gateQr: '<b>على الحاسوب؟</b> امسح الرمز بهاتف أندرويد: تُفتح دعوتك عليه جاهزة للتثبيت.',
    welcome: 'أهلًا بك بين الأنوار الأولى.',
    lockedTitle: 'بدعوة فقط.', lockedSub: 'يلّا في نسخة تجريبية خاصة. اطلب رابطك الشخصي ممّن دعاك.',
    pill: 'نسخة تجريبية خاصة · بدعوة',
    h1: 'يلّا، اخرج مع <em>أحبّتك.</em>',
    lead: `تطبيق تونسي لمن يفضّل ${L('الفعل')} على الشكوى: خرجات مع ${V('أحبّتك')}، و${L('وعد واحد')} لنفسك، وشارع تراه ${L('يتحسّن')}.`,
    whyTitle: 'لماذا يلّا',
    mission: `${L('تتحسّن تونس')} حين يتغيّر كلّ واحد منّا قليلًا: ${V('في طريقة تفكيرنا')}، ${V('وفي وقوفنا إلى جانب بعضنا')}، ${V('وفي عنايتنا بشارعنا')}. يحوّل يلّا ذلك إلى ${L('خطوات صغيرة وحقيقية')} تخطوها مع من حولك، ويُريك ${L('الفرق')}.`,
    p1: 'لمّة', p1d: 'خطط مع أحبّتك، والدعوة عبر واتساب بلمسة واحدة.',

    btn: 'تحميل لأندرويد', ios: 'آيفون: قريبًا',
    qr: '<b>على الحاسوب؟</b> امسح الرمز بهاتف أندرويد لفتح هذه الصفحة عليه.',
    s1: 'اضغط «تحميل لأندرويد» ثم افتح الملف.',
    s2: 'إذا ظهر تحذير Play Protect: «مزيد من التفاصيل» ← «التثبيت على أي حال». يظهر هذا لكل تطبيق من خارج متجر Play.',

    thanks1: `أنت لا تجرّب تطبيقًا فحسب، بل ${L('تُضيء أولى أنوار')} شارعٍ أفضل.`,
    thanks2: 'كلّ خلل تكتشفه وكلّ فكرة تشاركها تجعل النور التالي أقوى.',
    send: 'أرسل لنا نورًا', you: 'أنت', foot: 'نسخة تجريبية خاصة'
  }
};

// ---------- the invitation, read from the link fragment (never sent to any server) ----------
const frag = new URLSearchParams(location.hash.slice(1));
let invite = { i: frag.get('i'), k: frag.get('k'), to: (frag.get('to') || '').slice(0, 40), n: (frag.get('n') || '').replace(/\D/g, '').slice(0, 4) };
try {
  if (invite.k) localStorage.setItem('yalla-invite', JSON.stringify(invite));
  else invite = JSON.parse(localStorage.getItem('yalla-invite') || 'null') || invite;
} catch (e) {}
if (location.hash) history.replaceState(null, '', location.pathname);

let lang = 'en';
function setLang(l) {
  lang = T[l] ? l : 'en';
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach((el) => { el.innerHTML = t[el.dataset.t]; });
  document.querySelectorAll('.lang-cur').forEach((el) => { el.textContent = t.name; });
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.lang === lang)));
  // the guest's own words go in as text, never as HTML
  document.getElementById('who').textContent = invite.to || '';
  if (invite.k) {
    document.getElementById('gTitle').textContent = invite.to ? t.gTitle : t.gTitleAnon;
  } else {
    document.getElementById('gTitle').textContent = t.lockedTitle;
    document.getElementById('gSub').textContent = t.lockedSub;
  }
  const num = document.getElementById('num');
  num.hidden = !(invite.k && invite.n);
  num.textContent = t.num.replace('{n}', invite.n.padStart(2, '0'));
  const you = document.querySelector('.lamp.you span'); if (you) you.textContent = invite.to || t.you;
  try { localStorage.setItem('yalla-lang', lang); } catch (e) {}
}

// language menus (header + invitation)
const tpl = document.getElementById('langTpl');
document.querySelectorAll('[data-lang-slot]').forEach((slot) => slot.appendChild(tpl.content.cloneNode(true)));
document.querySelectorAll('.lang').forEach((box) => {
  const btn = box.querySelector('.lang-btn'), menu = box.querySelector('.lang-menu');
  const close = () => { menu.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); };
  btn.addEventListener('click', (e) => { e.stopPropagation(); const open = !menu.classList.contains('open'); menu.classList.toggle('open', open); btn.setAttribute('aria-expanded', String(open)); if (open) menu.querySelector('[aria-checked="true"]')?.focus(); });
  menu.addEventListener('click', (e) => { const b = e.target.closest('[data-lang]'); if (b) { setLang(b.dataset.lang); close(); btn.focus(); } });
  menu.addEventListener('keydown', (e) => {
    const items = [...menu.querySelectorAll('[data-lang]')], i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    if (e.key === 'Escape') { close(); btn.focus(); }
  });
  document.addEventListener('click', close);
});

let saved = null; try { saved = localStorage.getItem('yalla-lang'); } catch (e) {}
const nav = (navigator.language || 'en').slice(0, 2);
setLang(saved || (T[nav] ? nav : 'en'));

// ---------- the medina skyline ----------
(function city() {
  const svg = document.getElementById('city'); let x = 0, out = '', wins = [];
  const rnd = (() => { let s = 7; return () => (s = (s * 9301 + 49297) % 233280) / 233280; })();
  while (x < 1200) {
    const w = 46 + rnd() * 70, h = 50 + rnd() * 90, top = 190 - h;
    out += `<rect class="b" x="${x}" y="${top}" width="${w + 1}" height="${h}"/>`;
    const r = rnd();
    if (r < .22) out += `<path class="b" d="M${x + w * .2} ${top} a${w * .3} ${w * .3} 0 0 1 ${w * .6} 0z"/>`;            // dome
    else if (r < .3) out += `<rect class="b" x="${x + w * .38}" y="${top - 70}" width="${w * .24}" height="70"/><path class="b" d="M${x + w * .38} ${top - 70} l${w * .12} -16 l${w * .12} 16z"/>`; // minaret
    for (let wy = top + 14; wy < 176; wy += 22) for (let wx = x + 9; wx < x + w - 12; wx += 18) if (rnd() > .35) wins.push([wx, wy]);
    x += w + 2;
  }
  out += wins.map(([wx, wy]) => `<rect class="w" x="${wx}" y="${wy}" width="7" height="10" rx="1.5" style="--d:${(Math.abs(wx - 600) / 600 * 1.2 + rnd() * .3).toFixed(2)}s"/>`).join('');
  svg.innerHTML = out;
})();

// ---------- the sealed download link: opens only with the key from a personal invitation ----------
const b64 = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));
async function openSeal(id, k) {
  const all = await (await fetch('sealed.json', { cache: 'no-store' })).json();
  const sealed = all.e && all.e[id];            // no entry: the invitation was revoked
  if (!sealed) throw new Error('inactive');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(k), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(sealed.s), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(sealed.i) }, key, b64(sealed.c))));
}
const gate = document.getElementById('gate'), hold = document.getElementById('hold');
const enter = () => { gate.classList.add('gone'); document.body.classList.remove('locked'); };
let opened = null;
if (!invite.k) { hold.disabled = true; document.getElementById('hint').hidden = true; }
else openSeal(invite.i, invite.k).then((d) => {
    opened = d; document.querySelectorAll('[data-apk]').forEach((a) => { a.href = d.apk; });
    // returning guests who already lit their lamp walk straight in (only while the invitation is active)
    try { if (localStorage.getItem('yalla-lit') === '1') enter(); } catch (e) {}
  }).catch(() => {
    invite = { i: null, k: null, to: '', n: '' };
    try { localStorage.removeItem('yalla-invite'); localStorage.removeItem('yalla-lit'); } catch (e) {}
    hold.disabled = true; document.getElementById('hint').hidden = true; document.getElementById('gateQr').classList.remove('on'); setLang(lang);
  });

// press and hold (touch, mouse, keyboard): the ring fills, the lamp ignites, the city lights up
const HOLD_MS = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 1400;
let t0 = 0, raf = 0, done = false;
const setP = (p) => hold.style.setProperty('--p', p.toFixed(3));
function tick(now) {
  const p = Math.min(1, (now - t0) / HOLD_MS); setP(p);
  if (p < 1) { raf = requestAnimationFrame(tick); return; }
  done = true; hold.classList.remove('active'); gate.classList.add('lit');
  try { localStorage.setItem('yalla-lit', '1'); } catch (e) {}
  setTimeout(enter, 3400);
}
function start(e) { if (done || hold.disabled) return; e.preventDefault(); hold.classList.add('active'); t0 = performance.now(); raf = requestAnimationFrame(tick); }
function stop() { if (done) return; cancelAnimationFrame(raf); hold.classList.remove('active');
  const from = parseFloat(hold.style.getPropertyValue('--p') || 0), s = performance.now();
  (function back(now) { const p = Math.max(0, from - (now - s) / 400); setP(p); if (p > 0 && !done && !hold.classList.contains('active')) requestAnimationFrame(back); })(s); }
hold.addEventListener('pointerdown', start);
['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => hold.addEventListener(ev, stop));
hold.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) start(e); });
hold.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') stop(); });
hold.addEventListener('contextmenu', (e) => e.preventDefault());

// ---------- the street: eight lamps, the last one is the guest's ----------
const street = document.getElementById('street');
street.innerHTML = Array.from({ length: 9 }, (_, k) => `<div class="lamp${k === 8 ? ' you' : ''}" style="--d:${k}"><i></i><b></b>${k === 8 ? '<span></span>' : ''}</div>`).join('');
setLang(lang);
if ('IntersectionObserver' in window) {
  new IntersectionObserver(([e], o) => { if (e.isIntersecting) { street.classList.add('on'); o.disconnect(); } }, { threshold: .6 }).observe(street);
  const bar = document.getElementById('sticky');
  new IntersectionObserver(([e]) => bar.classList.toggle('hide', e.isIntersecting)).observe(document.getElementById('download'));
} else street.classList.add('on');

try {
  // on a computer the guest scans their OWN invitation onto their phone
  const mine = invite.k ? '#' + new URLSearchParams({ i: invite.i, k: invite.k, to: invite.to, n: invite.n }).toString() : '';
  const qr = qrcode(0, 'M'); qr.addData(location.origin + location.pathname + mine); qr.make();
  document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  if (invite.k) { document.getElementById('gqr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); document.getElementById('gateQr').classList.add('on'); }
} catch (e) { document.querySelector('.row').style.display = 'none'; }
