<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Yalla: plans with your people, one promise to yourself, and your street before and after. Private beta for Android.">
<meta property="og:type" content="website">

<meta property="og:description" content="Tunisia gets better when each of us changes a little. Private beta for Android.">

<link rel="apple-touch-icon" href="yalla.png">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#06030F; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
    --ink:#F4F1FF; --muted:#A79FC4; --violet:#6D4AE0; --violet-l:#A98CFF; --gold:#FFC148; --gold-2:#FFE7A8;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    min-height:100vh; background:var(--bg); color:var(--ink);
    font:16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    background-image:
      radial-gradient(900px 600px at 18% 30%, rgba(109,74,224,.28), transparent 60%),
      radial-gradient(700px 500px at 85% 80%, rgba(255,193,72,.10), transparent 60%);
    background-attachment:fixed;
    display:flex; flex-direction:column;
  }
  html[lang="ar"] body { font-family:Cairo, system-ui, sans-serif; }
  /* a few still stars, CSS only */
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.55;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 27% 72%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 44% 9%, var(--gold-2), transparent), radial-gradient(1px 1px at 63% 41%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 78% 14%, #fff, transparent), radial-gradient(1px 1px at 91% 58%, var(--gold-2), transparent),
      radial-gradient(1px 1px at 7% 88%, #fff, transparent), radial-gradient(1.5px 1.5px at 52% 93%, #fff, transparent);
  }

  header, main, footer { width:100%; max-width:1120px; margin:0 auto; padding:0 24px; position:relative; }
  header { display:flex; align-items:center; justify-content:space-between; padding-top:22px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.2px; }
  .brand img { width:30px; height:30px; border-radius:8px; }
  .langs { display:flex; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px; }
  .langs button {
    font:inherit; font-size:13px; font-weight:700; color:var(--muted); background:none; border:0;
    padding:6px 12px; border-radius:999px; cursor:pointer; transition:background .3s var(--ease), color .3s var(--ease);
  }
  .langs button[aria-pressed="true"] { background:var(--violet); color:#fff; }
  .langs button:focus-visible, .btn:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }

  main { flex:1; display:grid; grid-template-columns:1.1fr .9fr; grid-template-areas:'hero card' 'why card'; column-gap:56px; row-gap:32px; align-items:start; padding-top:40px; padding-bottom:40px; }
  .hero { grid-area:hero; } .why { grid-area:why; } .card { grid-area:card; align-self:center; }
  .why h2 { font-size:13px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--gold); margin:0 0 10px; }
  html[lang='ar'] .why h2 { text-transform:none; letter-spacing:0; font-size:15px; }
  .mission { margin:0 0 22px; font-size:16.5px; max-width:520px; color:var(--ink); opacity:.92; }
  .sticky { display:none; }
  .lit, .litv { font-style:normal; font-weight:700; color:var(--gold-2); text-shadow:0 0 14px rgba(255,193,72,.55), 0 0 32px rgba(255,193,72,.25); }
  .litv { color:#D9CCFF; text-shadow:0 0 14px rgba(169,140,255,.65), 0 0 32px rgba(109,74,224,.35); }
  .pillars b { color:var(--gold-2); text-shadow:0 0 12px rgba(255,193,72,.45); }
  .thanks { text-align:center; max-width:640px; margin:8px auto 28px; padding:0 24px; position:relative; }
  .thanks p { margin:0 0 6px; font-size:17px; line-height:1.6; }
  .thanks a { color:var(--violet-l); font-weight:700; text-decoration:none; border-bottom:1px solid rgba(169,140,255,.4); }
  .thanks a:hover { border-color:var(--violet-l); }

  .hero .logo {
    width:132px; height:132px; border-radius:32px; display:block; margin-bottom:28px;
    box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 20px 70px rgba(109,74,224,.55), 0 0 120px rgba(255,193,72,.12);
    animation:rise .9s var(--ease) both;
  }
  .pill { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--gold); border:1px solid rgba(255,193,72,.35); border-radius:999px; padding:4px 12px; margin-bottom:16px; }
  html[lang="ar"] .pill { text-transform:none; letter-spacing:0; }
  h1 { font-size:clamp(36px, 5vw, 60px); line-height:1.08; margin:0 0 16px; font-weight:900; letter-spacing:-.5px; }
  h1 em { font-style:normal; background:linear-gradient(90deg, var(--violet-l), var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .lead { color:var(--muted); font-size:18px; max-width:520px; margin:0; }
  .pillars { list-style:none; padding:0; margin:0; display:grid; gap:12px; max-width:520px; }
  .pillars li { display:flex; gap:14px; align-items:flex-start; }
  .pillars b { display:block; }
  .pillars span { color:var(--muted); font-size:15px; }
  .dot { flex:none; width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:var(--card); border:1px solid var(--line); }
  .dot svg { width:18px; height:18px; }

  .card {
    background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    border:1px solid var(--line); border-radius:24px; padding:28px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 30px 80px rgba(0,0,0,.45);
    animation:rise .9s .12s var(--ease) both;
  }
  .card h2 { margin:0 0 4px; font-size:20px; }
  .card .sub { margin:0 0 20px; color:var(--muted); font-size:14px; }
  .btn {
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    background:var(--violet); color:#fff; text-decoration:none; font-weight:800; font-size:17px;
    padding:16px 18px; border-radius:14px; transition:transform .3s var(--ease), box-shadow .3s var(--ease);
    box-shadow:0 10px 30px rgba(109,74,224,.45);
  }
  .btn:hover { transform:translateY(-2px); box-shadow:0 16px 40px rgba(109,74,224,.6); }
  .btn svg { width:20px; height:20px; }
  .meta { display:flex; justify-content:center; gap:14px; color:var(--muted); font-size:12.5px; margin:10px 0 22px; }
  .row { display:grid; grid-template-columns:auto 1fr; gap:20px; align-items:center; border-top:1px solid var(--line); padding-top:20px; }
  #qr { width:116px; height:116px; background:#fff; border-radius:12px; padding:8px; }
  #qr svg { width:100%; height:100%; display:block; }
  .row p { margin:0; font-size:14px; color:var(--muted); }
  .row p b { color:var(--ink); }
  ol { margin:20px 0 0; padding-inline-start:20px; color:var(--muted); font-size:14px; }
  ol li { margin:6px 0; }
  ol li::marker { color:var(--gold); font-weight:700; }

  footer { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:13px; padding-bottom:24px; }

  /* invitation gate */
  body.locked { overflow:hidden; }
  #gate { position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:24px; overflow:hidden;
    background:radial-gradient(700px 520px at 50% 38%, rgba(109,74,224,.38), transparent 70%), var(--bg);
    transition:opacity .9s var(--ease), visibility .9s; }
  #gate.gone { opacity:0; visibility:hidden; }
  #gate .langs { position:absolute; top:22px; inset-inline-end:24px; }
  .gate-in { width:100%; max-width:420px; text-align:center; position:relative; z-index:1; }
  .gate-logo { width:120px; height:120px; border-radius:30px; display:block; margin:0 auto 26px; animation:breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { box-shadow:0 0 40px rgba(109,74,224,.45); } 50% { box-shadow:0 0 90px rgba(169,140,255,.7), 0 0 150px rgba(255,193,72,.18); } }
  .gate-in h1 { font-size:clamp(30px, 8vw, 42px); margin:12px 0 8px; }
  .gate-copy p { color:var(--muted); margin:0 0 24px; }
  .code { display:flex; gap:8px; }
  .code input { flex:1; min-width:0; font:inherit; font-size:17px; font-weight:800; letter-spacing:3px; text-transform:uppercase; text-align:center;
    color:var(--ink); background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:14px; padding:15px 12px; outline:none; transition:border-color .3s; }
  .code input::placeholder { letter-spacing:1.5px; color:#6f6890; font-weight:600; }
  .code input:focus { border-color:var(--violet-l); }
  .code button { font:inherit; font-weight:800; color:#1b1206; background:linear-gradient(90deg, var(--gold), var(--gold-2)); border:0; border-radius:14px; padding:0 20px; cursor:pointer; box-shadow:0 8px 26px rgba(255,193,72,.35); }
  .code button:disabled { opacity:.6; }
  .code button:focus-visible, .code input:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
  .err { min-height:22px; color:#FF9C85; font-size:14px; margin-top:10px; }
  .shake { animation:shake .45s; }
  @keyframes shake { 20%,60% { transform:translateX(-8px); } 40%,80% { transform:translateX(8px); } }
  .chosen { position:absolute; left:0; right:0; top:150px; opacity:0; transform:translateY(10px); transition:opacity .8s .5s var(--ease), transform .8s .5s var(--ease);
    font-size:22px; line-height:1.4; font-weight:800; color:var(--gold-2); text-shadow:0 0 18px rgba(255,193,72,.6); }
  #gate.open .gate-copy, #gate.open form, #gate.open .err { opacity:0; transition:opacity .35s; pointer-events:none; }
  #gate.open .chosen { opacity:1; transform:none; }
  #gate.open .gate-logo { animation:flare 1.5s var(--ease) forwards; }
  @keyframes flare { to { transform:scale(1.18); box-shadow:0 0 120px rgba(255,193,72,.9), 0 0 260px rgba(169,140,255,.65); } }
  #gate::after { content:""; position:absolute; left:50%; top:calc(50% - 120px); width:40px; height:40px; margin:-20px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,231,168,.95), rgba(255,193,72,.35) 40%, transparent 70%); transform:scale(0); opacity:0; pointer-events:none; }
  #gate.open::after { animation:burst 1.8s 1.6s var(--ease) forwards; }
  @keyframes burst { 0% { transform:scale(0); opacity:1; } 100% { transform:scale(70); opacity:0; } }

  /* the street of lamps */
  .street { display:flex; align-items:flex-end; justify-content:center; gap:clamp(12px, 4vw, 34px); margin:8px auto 22px; }
  .lamp { display:flex; flex-direction:column; align-items:center; }
  .lamp i { width:10px; height:10px; border-radius:50%; background:#2b2440; transition:background .7s, box-shadow .7s; transition-delay:calc(var(--d) * .22s); }
  .lamp b { width:2px; height:46px; background:linear-gradient(#3b3355, transparent); }
  .lamp.you i { width:16px; height:16px; }
  .lamp.you b { height:64px; }
  .lamp.you span { font-size:11px; font-weight:800; color:var(--gold); margin-top:4px; opacity:0; transition:opacity .7s; transition-delay:calc(var(--d) * .22s); }
  .street.on .lamp i { background:var(--gold-2); box-shadow:0 0 10px var(--gold), 0 0 28px rgba(255,193,72,.55); }
  .street.on .lamp.you i { box-shadow:0 0 14px var(--gold), 0 0 44px rgba(255,193,72,.8), 0 0 90px rgba(169,140,255,.4); }
  .street.on .lamp.you span { opacity:1; }
  .thanks .t1 { font-size:clamp(19px, 2.6vw, 24px); font-weight:800; line-height:1.4; margin-bottom:10px; }
  .thanks .t2 { color:var(--muted); font-size:16px; margin:0 0 20px; }
  .send { display:inline-flex; align-items:center; gap:8px; color:var(--gold-2); text-decoration:none; font-weight:800; border:1px solid rgba(255,193,72,.45); border-radius:999px; padding:11px 20px; transition:background .3s var(--ease), box-shadow .3s var(--ease); }
  .send:hover { background:rgba(255,193,72,.1); box-shadow:0 0 24px rgba(255,193,72,.3); }
  .send svg { width:18px; height:18px; }

  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

  @media (max-width: 860px) {
    main { grid-template-columns:1fr; grid-template-areas:'hero' 'card' 'why'; row-gap:28px; padding-top:20px; padding-bottom:110px; }
    .hero .logo { width:76px; height:76px; border-radius:20px; margin-bottom:16px; }
    h1 { font-size:clamp(32px, 9vw, 40px); }
    .lead { font-size:16px; }
    .row { display:none; }               /* on the phone itself, the QR is useless */
    .card { padding:22px; border-radius:20px; }
    .sticky {
      display:block; position:fixed; left:0; right:0; bottom:0; z-index:10;
      padding:12px 16px calc(12px + env(safe-area-inset-bottom));
      background:linear-gradient(180deg, rgba(6,3,15,0), rgba(6,3,15,.92) 35%);
      transition:transform .35s var(--ease), opacity .35s var(--ease);
    }
    .sticky.hide { transform:translateY(110%); opacity:0; pointer-events:none; }
  }
  @media (max-width: 420px) {
    header, main, footer { padding-left:16px; padding-right:16px; }
    .card { padding:20px; }
  }
</style>
</head>

<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gTitle">
  <nav class="langs" aria-label="Language">
    <button type="button" data-lang="ar">ع</button>
    <button type="button" data-lang="fr">FR</button>
    <button type="button" data-lang="en">EN</button>

  <div class="gate-in">
    <img class="gate-logo" src="yalla.png" alt="Yalla" width="120" height="120">
    <div class="gate-copy">
      <span class="pill" data-t="pill"></span>

      <p data-t="gSub"></p>

    <form class="code" id="codeForm" autocomplete="off">
      <input id="code" name="code" data-tp="gPh" autocapitalize="characters" spellcheck="false" aria-labelledby="gTitle" required>

</div>

<header>

<main>

      <li><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#FFC148" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.4 5.6L20 9.3l-4.3 3.9 1.2 5.8L12 16l-4.9 3 1.2-5.8L4 9.3l5.6-.7z"/></svg></span><div><b data-t="p2"></b><span data-t="p2d"></span></div></li>
      <li><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#3FD2C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="8" height="14" rx="2"/><rect x="13" y="5" width="8" height="14" rx="2"/><path d="M6 15l2-3 2 3M16 13l1.5 2 2.5-4"/></svg></span><div><b data-t="p3"></b><span data-t="p3d"></span></div></li>

<footer>
  <span data-t="foot"></span>
  <span>© Yalla · Tunisia</span>

<script>
const T = {

  },
  fr: {

    h1: 'Sortez avec <em>les vôtres.</em>',

function setLang(l) {
  const t = T[l] || T.en;
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t[el.dataset.t]; });
  document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = t[el.dataset.tp]; });
  const you = document.querySelector('.lamp.you span'); if (you) you.textContent = t.you;
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  try { localStorage.setItem('yalla-lang', l); } catch (e) {}
}
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

let saved = null;
try { saved = localStorage.getItem('yalla-lang'); } catch (e) {}
const nav = (navigator.language || 'en').slice(0, 2);
setLang(saved || (T[nav] ? nav : 'en'));

// The APK link is sealed with the invitation code (PBKDF2 -> AES-GCM): without the code, the source shows nothing.
const SEALED = {"s":"iMqQs1zgCNTROFZudmzM3w==","i":"Tl1MmYO8i/sasArn","c":"L6FPc50o1P7dR+dvJeBSAcF/uW6weUod8Iqd/14ipaHcbkO76RontHnPzoGUqzv4/Qq+BVwWJJPaDhaXOq4aysA/JybIhj4cCLIpazqnqQOo3TdEWT+gFIrwJJhg4kU6zq5vDg9IvlE="};
const b64 = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));
async function openSeal(code) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code.trim().toUpperCase()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SEALED.s), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(SEALED.i) }, key, b64(SEALED.c))));
}
const gate = document.getElementById('gate'), form = document.getElementById('codeForm'), input = document.getElementById('code'), err = document.getElementById('err');
function unlock(data, animate) {
  document.querySelectorAll('[data-apk]').forEach((a) => { a.href = data.apk; });
  const done = () => { gate.classList.add('gone'); document.body.classList.remove('locked'); };
  if (!animate) return done();
  gate.classList.add('open');
  setTimeout(done, 3300);
}
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = form.querySelector('button'); btn.disabled = true; err.textContent = '';
  try {
    const data = await openSeal(input.value);
    try { localStorage.setItem('yalla-invite', input.value.trim().toUpperCase()); } catch (x) {}
    unlock(data, true);
  } catch (x) {
    err.textContent = T[document.documentElement.lang].gErr;
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    btn.disabled = false; input.select();
  }
});
// An invitation link can carry the code (…/yalla-tn/#invite=CODE): it fills in, the guest still taps.
const fromLink = location.hash.match(/invite=([^&]+)/);
if (fromLink) { input.value = decodeURIComponent(fromLink[1]); history.replaceState(null, '', location.pathname); }
(async () => {
  let saved = null; try { saved = localStorage.getItem('yalla-invite'); } catch (x) {}
  if (saved) { try { unlock(await openSeal(saved), false); return; } catch (x) {} }
  if (!fromLink) input.focus();
})();

// the street: eight lamps, the last one is yours; they light up when you reach them
const street = document.getElementById('street');
street.innerHTML = Array.from({ length: 9 }, (_, k) => `<div class="lamp${k === 8 ? ' you' : ''}" style="--d:${k}"><i></i><b></b>${k === 8 ? '<span></span>' : ''}</div>`).join('');
setLang(document.documentElement.lang);
if ('IntersectionObserver' in window) {
  new IntersectionObserver(([e], o) => { if (e.isIntersecting) { street.classList.add('on'); o.disconnect(); } }, { threshold: .6 }).observe(street);
} else street.classList.add('on');

const bar = document.getElementById('sticky');
if ('IntersectionObserver' in window) {
  new IntersectionObserver(([e]) => bar.classList.toggle('hide', e.isIntersecting)).observe(document.getElementById('download'));
}

try {
  const qr = qrcode(0, 'M');
  qr.addData(location.origin + location.pathname);
  qr.make();
  document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
} catch (e) { document.querySelector('.row').style.display = 'none'; }
</script>
